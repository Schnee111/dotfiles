# Fallback kitty palette for rices that do not generate a terminal theme.
# A snapshot of the end4-pC generated palette (dark, Material-ish), used when
# install.sh points ~/.config/kitty/rice-theme.conf at this file instead of a
# live generator output. Keep it opaque-background: the tracked kitty.conf
# includes rice-theme.conf before background_opacity, so the translucent glass
# still wins.
background            #131C1B

color0                #131C1B
color1                #819B2F
color2                #79E19F
color3                #ADF8A1
color4                #76B6B3
color5                #7BAEEA
color6                #89D9BC
color7                #D1DBCB
color8                #899391
color9                #AACE43
color10               #F6FFF4
color11               #FFFFFF
color12               #BFE4DB
color13               #C8DAFF
color14               #EAFFF3
color15               #C7EAE5

cursor                #D1DBCB

foreground            #D1DBCB

selection_background  #CCE8E4
selection_foreground  #354E4A

