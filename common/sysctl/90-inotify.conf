# Installed by setup_inotify_limit.sh into /etc/sysctl.d/.
# The default of 128 inotify instances per user is nearly used up by a normal
# session here (one per kitty window, fish shell, dev server, Electron app...),
# and once it runs out new file watchers silently stop working.
fs.inotify.max_user_instances = 1024
