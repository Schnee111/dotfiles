# Let members of asus-power toggle the battery charge threshold and set default to 80 on boot
z /sys/class/power_supply/BAT0/charge_control_end_threshold 0664 root asus-power -
w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 80

# Let members of asus-power toggle the ACPI platform profile (quiet / balanced / performance)
z /sys/firmware/acpi/platform_profile 0664 root asus-power -
z /sys/devices/platform/asus-nb-wmi/throttle_thermal_policy 0664 root asus-power -
