<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background glass panel -->
  <rect x="6" y="8" width="36" height="32" rx="8" fill="url(#glassGrad)" fill-opacity="0.25" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- Top window bar line -->
  <line x1="6" y1="17" x2="42" y2="17" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
  <!-- Window dots -->
  <circle cx="12" cy="12.5" r="1.8" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="17.5" cy="12.5" r="1.8" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="23" cy="12.5" r="1.8" fill="#ffffff" fill-opacity="0.4"/>
  <!-- Frosted glass diagonal shine -->
  <path d="M 12 34 L 28 20 L 32 20 L 16 34 Z" fill="url(#shine)"/>
  <path d="M 22 34 L 34 23 L 37 23 L 25 34 Z" fill="url(#shine)"/>
</svg>
