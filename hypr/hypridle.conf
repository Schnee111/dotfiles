$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")'
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = $lock_cmd
    after_sleep_cmd = /home/schnee/.config/hypr/scripts/wake_dpms.sh
    inhibit_sleep = 1
}

# 1. Fast sleep when already locked (e.g. manual lock via Super+L or Lock button)
# Inactivity for 150 seconds (2.5 mins) while locked -> sleep display
listener {
    timeout = 150 # 2.5 mins
    on-timeout = /home/schnee/.config/hypr/scripts/sleep_dpms.sh
    on-resume = /home/schnee/.config/hypr/scripts/wake_dpms.sh
    condition_cmd = test "$(hyprctl locked)" = "true"
}

# 2. Idle lock when unlocked
# Inactivity for 300 seconds (5 mins) -> lock screen
listener {
    timeout = 300 # 5 mins
    on-timeout = $lock_cmd
}

# 3. Sleep after idle lock
# Inactivity for 450 seconds (7.5 mins total = exactly 2.5 mins after the 5-min idle lock) -> sleep display
listener {
    timeout = 450 # 7.5 mins (2.5 mins after idle lock)
    on-timeout = /home/schnee/.config/hypr/scripts/sleep_dpms.sh
    on-resume = /home/schnee/.config/hypr/scripts/wake_dpms.sh
}

# 4. System suspend after 30 mins
listener {
    timeout = 1800 # 30 mins
    on-timeout = $suspend_cmd
}
