# Vitreus idle: single locker = pleamar lockscreen scene (idempotent, skips if already locked)
$lock_cmd = sh -c 'hyprctl locked | grep -q true || pleamar --say lockscreen "fact locked true"'
$suspend_cmd = sh -c 'hyprctl locked | grep -q true || pleamar --say lockscreen "fact locked true"; systemctl suspend || loginctl suspend'

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = sh -c 'hyprctl locked | grep -q true || pleamar --say lockscreen "fact locked true"'
    inhibit_sleep = 3
}

# Idle lock when unlocked: 5 mins -> pleamar lockscreen
listener {
    timeout = 300 # 5 mins
    on-timeout = $lock_cmd
}

# Sleep display 2.5 mins after lock
listener {
    timeout = 450 # 7.5 mins
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# System suspend after 30 mins
listener {
    timeout = 1800 # 30 mins
    on-timeout = $suspend_cmd
}
