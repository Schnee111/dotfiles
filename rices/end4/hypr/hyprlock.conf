source = ~/.config/hypr/hyprlock/colors.conf

general {
    grace = 0
    disable_loading_bar = true
    hide_cursor = false
    no_fade_in = false
}

background {
    monitor =
    path = $background_image
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false
    placeholder_text = <i>Input password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 72
    font_family = $font_family_clock
    position = 0, 140
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, 70
    halign = center
    valign = center
}

label { # User
    monitor =
    text =    $USER
    color = $text_color
    font_size = 18
    font_family = $font_family
    position = 0, -20
    halign = center
    valign = center
}
