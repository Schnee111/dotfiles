$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = pidof hyprlock || hyprlock; systemctl suspend || loginctl suspend

general {
  lock_cmd = $lock_cmd
  before_sleep_cmd = $lock_cmd
  after_sleep_cmd = hyprctl dispatch dpms on
  inhibit_sleep = 3
}

# 1. Idle lock after 5 minutes (300s)
listener {
  timeout = 300
  on-timeout = $lock_cmd
}

# 2. DPMS off after 7.5 minutes (450s)
listener {
  timeout = 450
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# 3. System suspend after 30 minutes (1800s)
listener {
  timeout = 1800
  on-timeout = $suspend_cmd
}
