context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Headphones (Balanced)"
            media.name       = "Headphones (Balanced)"
            filter.graph = {
                nodes = [
                    {
                        type   = builtin
                        name   = mix_l
                        label  = mixer
                        control = { "Gain 1" = 1.0 }
                    }
                    {
                        type   = builtin
                        name   = mix_r
                        label  = mixer
                        control = { "Gain 1" = 1.1714 }
                    }
                ]
                inputs  = [ "mix_l:In 1" "mix_r:In 1" ]
                outputs = [ "mix_l:Out"  "mix_r:Out" ]
            }
            capture.props = {
                node.name        = "headphone_balanced"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "playback.headphone_balanced"
                audio.position   = [ FL FR ]
                node.passive     = true
                node.dont-reconnect = true
                target.object    = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink"
            }
        }
    }
]
