<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="rgba" mode="assign">
        <const>none</const>
    </edit>
  </match>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-material-symbols-vf-rounded-fonts/*</glob>
      <glob>/usr/share/fonts/material-icons-fonts/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
